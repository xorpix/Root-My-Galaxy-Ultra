name: Finish 1.4.6 maintenance

on:
  push:
    branches: [main]
    paths: ['.github/workflows/maintenance-release-146.yml']
  workflow_run:
    workflows: [Weekly backend release]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Run the 1.4.6 backend release')
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start the validated backend release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run backend-refresh.yml --ref main -f publish=true -f force_rebuild=false

  cleanup:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || startsWith(github.event.head_commit.message, 'Clean up 1.4.6 maintenance')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove the merged fix branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view 1.4.6 --json isDraft,isPrerelease,tagName --jq '.isDraft == false and .isPrerelease == false and .tagName == "1.4.6"' | grep -Fx true
          test "$(gh api repos/$GH_REPO/pulls/67 --jq .merged)" = true
          git merge-base --is-ancestor '1.4.6^{commit}' HEAD
          BRANCH=fix/susfs-shizuku-visibility-20261124
          BRANCH_SHA="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          if [ -n "$BRANCH_SHA" ]; then
            PR_SHA="$(gh api repos/$GH_REPO/pulls/67 --jq .head.sha)"
            test "$BRANCH_SHA" = "$PR_SHA"
            git fetch origin "$BRANCH"
            git merge-base --is-ancestor "$BRANCH_SHA" HEAD
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$BRANCH"
          fi
