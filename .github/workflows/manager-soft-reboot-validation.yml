name: Stage checked manager soft reboot build

on:
  push:
    branches: [fix/manager-soft-reboot-composer]

permissions:
  contents: write
  actions: read

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bf48dd62b8b33b380be55b3fe04b4ff9f2bd2687
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: checked-manager-soft-reboot-backends
          run-id: 38700274305
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/result
      - uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;36.0.0'
          accept-android-sdk-licenses: true
      - name: Validate the checked artifact against its exact source base
        run: |
          python3 - <<'VERIFY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools/backend-refresh')
          from common import load_config
          import release
          before = load_config()
          info = release.apply_checked_update(Path(os.environ['RUNNER_TEMP'], 'result'))
          after = load_config()
          assert info['base_commit'] == 'bf48dd62b8b33b380be55b3fe04b4ff9f2bd2687'
          assert set(info['changed']) == set(before['backends'])
          for name, target in before['backends'].items():
              for field in ('repository', 'branch', 'commit', 'commit_count', 'version', 'rust', 'daemon_version'):
                  assert target[field] == after['backends'][name][field], (name, field)
              assert not after['backends'][name]['rebuild']
          VERIFY
      - name: Recheck the formatter-aware source comparison and commit the bundles
        env:
          CANDIDATE_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          BRANCH=fix/manager-soft-reboot-composer
          REMOTE_HEAD=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          test "$REMOTE_HEAD" = "$CANDIDATE_HEAD"
          git show "$CANDIDATE_HEAD:tools/backend-refresh/test_samsung_composer.py" > tools/backend-refresh/test_samsung_composer.py
          python3 tools/backend-refresh/test_samsung_composer.py
          python3 tools/test_m3q_host.py BundleTests
          rm .github/workflows/manager-soft-reboot-validation.yml
          git reset --soft "$CANDIDATE_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'build: Stage checked backends with manager soft reboot hooks'
          python3 tools/backend-refresh/test_refresh.py
          python3 tools/backend-refresh/test_patching.py
          git diff --exit-code
          git push origin "HEAD:refs/heads/$BRANCH"
          echo 'Verified the existing native build, Android tests and APK receipt. No tag or public release was created.' >> "$GITHUB_STEP_SUMMARY"
