name: Finish 1.4.5 maintenance

on:
  push:
    branches: [main]
    paths: ['.github/workflows/maintenance-release-145.yml']

permissions:
  contents: read

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Run the 1.4.5 backend release')
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start the validated backend release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run backend-refresh.yml --ref main -f publish=true -f force_rebuild=false
          if [ "$(gh run view 45054984166 --json status --jq .status)" != completed ]; then
            gh run cancel 45054984166
          fi

  cleanup:
    if: startsWith(github.event.head_commit.message, 'Clean up 1.4.5 maintenance')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove the merged maintenance branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view 1.4.5 --json isDraft,isPrerelease,tagName --jq '.isDraft == false and .isPrerelease == false and .tagName == "1.4.5"' | grep -Fx true
          test "$(gh api repos/$GH_REPO/pulls/66 --jq .merged)" = true
          git merge-base --is-ancestor '1.4.5^{commit}' HEAD
          BRANCH=maintenance/release-1.4.5
          BRANCH_SHA="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          if [ -n "$BRANCH_SHA" ]; then
            git fetch origin "$BRANCH"
            git merge-base --is-ancestor "$BRANCH_SHA" HEAD
            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$BRANCH"
          fi

# Release 1.4.5 published. Run the guarded branch cleanup.
