name: Prepare verified 1.3.5 release
on:
  push:
    branches: ['maintenance/release-1.3.5-20261108']
    paths:
      - '.github/workflows/release-135-prepare.yml'
      - 'tools/prepare_release_135.py'
permissions:
  contents: write
  actions: write
concurrency:
  group: prepare-rmgu-1.3.5
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'xorpix/Root-My-Galaxy-Ultra' && github.ref == 'refs/heads/maintenance/release-1.3.5-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: RMGU-matched-backend-update-42509311883
          run-id: 42509311883
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/matched-backends
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          accept-android-sdk-licenses: true
      - name: Validate the artifact, prepare source, clean merged branches and start release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp tools/prepare_release_135.py "$RUNNER_TEMP/prepare_release_135.py"
          python3 "$RUNNER_TEMP/prepare_release_135.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-1.3.5-preparation-${{ github.run_id }}
          path: ${{ runner.temp }}/release-preparation.json
          if-no-files-found: warn
          retention-days: 30
