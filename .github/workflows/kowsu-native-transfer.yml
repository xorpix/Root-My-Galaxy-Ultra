name: Complete verified KowSU native transfer

on:
  push:
    branches:
      - feat/kowsu-backend
    paths:
      - .github/workflows/kowsu-native-transfer.yml

permissions:
  contents: write

concurrency:
  group: verified-kowsu-native-transfer
  cancel-in-progress: false

jobs:
  complete:
    if: github.ref == 'refs/heads/feat/kowsu-backend'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Reconstruct the approved payload and verify the complete source tree
        env:
          EXPECTED_TREE: 0fd83512d28ee5d9d42e6f70d034fd6c748d1742
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib
          parts = [Path('.github/native-transfer') / f'part-{i:03}.bin' for i in range(28)]
          data = b''.join(p.read_bytes() for p in parts)
          assert len(data) == 5309976, 'Unexpected native payload size'
          assert hashlib.sha256(data).hexdigest() == '55a3d375a74dc7b37c4c2ddd2801242139ff72ca0341199c40d36b0b77e233d1', 'Native payload checksum mismatch'
          assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == '5d57945fbef46be124f316e729bcbac3ad2716fa', 'Native Git blob mismatch'
          for name in ('app/src/main/assets/azhl/kowsu/ksud', 'app/src/main/jniLibs/arm64-v8a/libm3qksud_kowsu.so'):
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          print('Exact validated KowSU payload reconstructed in both bundle locations')
          PYTHON
          git add -- app/src/main/assets/azhl/kowsu/ksud app/src/main/jniLibs/arm64-v8a/libm3qksud_kowsu.so
          git rm -r -- .github/native-transfer
          git rm -- .github/workflows/kowsu-native-transfer.yml
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete verified KowSU backend bundle'
          git push origin HEAD:refs/heads/feat/kowsu-backend
