name: One-time repository branch cleanup
on:
  push:
    branches: [main]
    paths: ['docs/maintenance/branch-cleanup-20261103.json']
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: repository-cleanup-20261103
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'xorpix/Root-My-Galaxy-Ultra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive unique commits and delete reviewed branches atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/cleanup_branches_20261103.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branch-cleanup-20261103
          path: branch-cleanup-result.json
          if-no-files-found: error
          retention-days: 30
