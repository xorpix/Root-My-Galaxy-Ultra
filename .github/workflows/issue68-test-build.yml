name: Issue 68 hook-placement test build

# Temporary maintenance helper for issue #68: builds a release-signed test
# APK with the V3 hook-placement fix so the reporters can validate it before
# a final release is published. Creates no tag and no GitHub release; the
# signed APK is only a workflow artifact. Remove this file once the test
# round is over.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue68-test-build
  cancel-in-progress: true

jobs:
  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25 (matches the Gradle daemon criteria)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 cmake;3.22.1'
          accept-android-sdk-licenses: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Repository secret KEYSTORE_BASE64 is not set}"
          : "${KEYSTORE_PASSWORD:?Repository secret KEYSTORE_PASSWORD is not set}"
          : "${KEY_ALIAS:?Repository secret KEY_ALIAS is not set}"
          : "${KEY_PASSWORD:?Repository secret KEY_PASSWORD is not set}"

          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"

          {
            echo "KEYSTORE_FILE=$KEYSTORE_PATH"
            echo "KEYSTORE_TYPE=PKCS12"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # The same suite that gates releases; a test APK is never distributed
      # ahead of the checks that make it trustworthy.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build release-signed test APK
        run: ./gradlew :app:assembleRelease -PrmguVersionSuffix=issue68test2 --no-daemon

      - name: Verify embedded D2 companion
        run: python3 tools/verify_d2_helper.py app/build/outputs/apk/release/app-release.apk

      - name: Verify APK payload integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import zipfile

          apks = list(Path('app/build/outputs/apk/release').glob('*.apk'))
          if len(apks) != 1:
              raise SystemExit('Expected exactly one production APK')
          assets = Path('app/src/main/assets')
          jni = Path('app/src/main/jniLibs/arm64-v8a')
          with zipfile.ZipFile(apks[0]) as archive:
              names = archive.namelist()
              if len(names) != len(set(names)):
                  raise SystemExit('Duplicate APK ZIP entries')
              checked = 0
              for path in sorted(assets.rglob('*')):
                  if path.is_file():
                      entry = 'assets/' + path.relative_to(assets).as_posix()
                      if archive.read(entry) != path.read_bytes():
                          raise SystemExit('Packaged asset differs from source: ' + entry)
                      checked += 1
              for path in sorted(jni.glob('*.so')):
                  if path.name.startswith(('libm3q', 'librmgususfs')):
                      entry = 'lib/arm64-v8a/' + path.name
                      if archive.read(entry) != path.read_bytes():
                          raise SystemExit('Packaged helper differs from source: ' + entry)
                      checked += 1
              module = archive.read('assets/susfs/susfs_guard_lkm.ko')
              digest = hashlib.sha256(module).hexdigest()
              metadata = json.loads(archive.read('assets/susfs/bundle.json'))
              if metadata['module']['sha256'] != digest:
                  raise SystemExit('SusFS module/bundle hash mismatch')
          print('Verified', checked, 'bundled files; SusFS SHA-256:', digest)
          PY

      - name: Verify APK signature and alignment
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          EXPECTED_SHA256="$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" | grep -m 1 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')"
          for APK in app/build/outputs/apk/release/*.apk; do
            CERT="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")"
            SIGNED_SHA256="$(echo "$CERT" | grep -m 1 'SHA-256 digest' | awk '{print $NF}' | tr 'A-F' 'a-f')"
            if [ "$SIGNED_SHA256" != "$EXPECTED_SHA256" ]; then
              echo "::error::$APK is not signed with the repository key."
              exit 1
            fi
            "$BUILD_TOOLS/zipalign" -c 4 "$APK"
            echo "$APK: $SIGNED_SHA256"
          done

      - name: Stage the test APK
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(grep -oE 'appVersionBase[[:space:]]*=[[:space:]]*"[^"]+"' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)"
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk "release-assets/RootMyGalaxyUltra-${VERSION_NAME}-issue68test2.apk"
          (cd release-assets && sha256sum *.apk > SHA256SUMS)
          cat release-assets/SHA256SUMS

      - name: Upload the signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: issue68-test2-apk
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
