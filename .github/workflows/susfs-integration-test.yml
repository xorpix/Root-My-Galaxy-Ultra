name: SusFS Integration Test Build

on:
  push:
    branches: [feat/susfs-backends-20261017, feat/susfs-readlink-enoent, fix/susfs-audit-20261027, feat/susfs-dispatcher-20261029, test/bzja-20261030, feat/susfs-priority-20261030]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: susfs-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Record verified backend bundle for SusFS test')
    name: SusFS update test APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the source-pinned matched backend bundle
        run: |
          python3 tools/test_backend_bundle.py
          python3 tools/test_m3q_host.py BundleTests
          python3 -c "import sys; sys.path.insert(0, 'tools/backend-refresh'); from common import baseline; baseline(__import__('pathlib').Path.cwd())"

      - name: Verify SusFS source provenance and host regressions
        run: |
          python3 tools/check_susfs_bundle.py
          mkdir -p "$RUNNER_TEMP/susfs-source"
          tar -xzf backends/susfs/source.tar.gz -C "$RUNNER_TEMP/susfs-source"
          python3 "$RUNNER_TEMP/susfs-source/susfs/tools/run_host_suite.py" --output "$RUNNER_TEMP/susfs-host-results"

      - name: Upload SusFS host regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: susfs-host-regressions
          path: ${{ runner.temp }}/susfs-host-results
          if-no-files-found: warn
          retention-days: 14

      - name: Set up JDK 25 (matches the Gradle daemon criteria)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 cmake;3.22.1'
          accept-android-sdk-licenses: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Repository secret KEYSTORE_BASE64 is not set}"
          : "${KEYSTORE_PASSWORD:?Repository secret KEYSTORE_PASSWORD is not set}"
          : "${KEY_ALIAS:?Repository secret KEY_ALIAS is not set}"
          : "${KEY_PASSWORD:?Repository secret KEY_PASSWORD is not set}"

          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"

          {
            echo "KEYSTORE_FILE=$KEYSTORE_PATH"
            echo "KEYSTORE_TYPE=PKCS12"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # Before the APKs, so a failing test reports as a failing test rather than as a build that
      # stopped somewhere. The release workflow runs the same task for the same reason: a stable
      # release is not a way past the suite.
      - name: Check root probe deadlines and unlock evidence
        run: python3 tools/test_su_process.py

      - name: Check early Odin handoff and adaptive exploit wait
        run: python3 tools/test_early_root_speed.py

      - name: Check settings and translations
        run: |
          python3 tools/test_settings_presentation.py
          python3 tools/test_translations.py
          python3 tools/check_translations.py

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build APKs
        env:
          RMGU_TEST_SUFFIX: ${{ startsWith(github.ref_name, 'feat/susfs-priority-') && 'priority-test1' || github.ref_name == 'test/bzja-20261030' && 'bzja-test1' || startsWith(github.ref_name, 'feat/susfs-dispatcher-') && 'dispatcher-test1' || '' }}
        run: ./gradlew assembleRelease "-PrmguVersionSuffix=$RMGU_TEST_SUFFIX" --no-daemon

      - name: Verify embedded D2 companions
        run: |
          python3 -m unittest discover -s tools/backend-refresh -p test_d2_signing.py
          python3 tools/verify_d2_helper.py app/build/outputs/apk/release/app-release.apk

      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"

          CERT="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")"
          SIGNED_DN="$(echo "$CERT" | grep -m 1 'certificate DN' | cut -d: -f2- | sed 's/^ *//')"
          SIGNED_SHA256="$(echo "$CERT" | grep -m 1 'SHA-256 digest' | awk '{print $NF}' | tr 'A-F' 'a-f')"
          EXPECTED_SHA256="$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" | grep -m 1 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')"

          if [ "$SIGNED_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Release APK is not signed with the repository key (got $SIGNED_SHA256, expected $EXPECTED_SHA256)."
            exit 1
          fi

          {
            echo "### Release APK signature"
            echo
            echo "- DN: \`$SIGNED_DN\`"
            echo "- SHA-256: \`$SIGNED_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the final module bytes and APK contents
        run: |
          python3 tools/check_susfs_bundle.py --apk app/build/outputs/apk/release/app-release.apk
          python3 - <<'PYTHON'
          import hashlib, json, sys, zipfile
          from pathlib import Path
          sys.path.insert(0, 'tools/backend-refresh')
          from common import REPOSITORIES
          root = Path('app/src/main/assets/susfs/bzig')
          profile = json.loads((root / 'profile.json').read_text())
          expected = profile['module']['sha256']
          assert profile['module']['sha256'] == expected
          for path in Path('app/src/main/assets/susfs').glob('*/profile.json'):
              variant = json.loads(path.read_text())
              assert variant['module'] == profile['module'], str(path)
              assert variant['sourceCommit'] == profile['sourceCommit'], str(path)
          assert hashlib.sha256((root / 'susfs_guard_lkm.ko').read_bytes()).hexdigest() == expected
          apk = Path('app/build/outputs/apk/release/app-release.apk')
          with zipfile.ZipFile(apk) as z:
              assert hashlib.sha256(z.read('assets/susfs/bzig/susfs_guard_lkm.ko')).hexdigest() == expected
              assert json.loads(z.read('assets/susfs/bzig/profile.json')) == profile
              for path in Path('app/src/main/assets/susfs').glob('*/profile.json'):
                  name = str(path.relative_to('app/src/main/assets'))
                  assert json.loads(z.read('assets/' + name)) == json.loads(path.read_text())
              for backend in REPOSITORIES:
                  manifest = json.loads(Path(f'backends/{backend}/build-manifest.json').read_text())
                  daemon = z.read(f'assets/azhl/{backend}/ksud')
                  assert hashlib.sha256(daemon).hexdigest() == manifest['outputs']['ksud']['sha256']
                  name = backend.replace('-', '_')
                  assert z.read(f'lib/arm64-v8a/libm3qksud_{name}.so') == daemon
          PYTHON
          git diff --exit-code

      - name: Build and verify a rollback APK from stable 1.3.0
        if: startsWith(github.ref_name, 'feat/susfs-priority-')
        shell: bash
        run: |
          set -euo pipefail
          BASE=b75e542957dfc38d574bcc0df585578c8dd9c10d
          ROLLBACK="$RUNNER_TEMP/rmgu-rollback"
          git fetch --depth=1 origin "$BASE"
          git worktree add --detach "$ROLLBACK" "$BASE"
          cd "$ROLLBACK"
          ./gradlew assembleRelease --no-daemon
          APK="$ROLLBACK/app/build/outputs/apk/release/app-release.apk"
          python3 tools/check_susfs_bundle.py --apk "$APK"
          python3 tools/verify_d2_helper.py "$APK"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          CANDIDATE="$GITHUB_WORKSPACE/app/build/outputs/apk/release/app-release.apk"
          CERT="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")"
          EXPECTED_CERT="$("$BUILD_TOOLS/apksigner" verify --print-certs "$CANDIDATE")"
          SIGNED_SHA256="$(echo "$CERT" | grep -m 1 'SHA-256 digest' | awk '{print $NF}')"
          EXPECTED_SHA256="$(echo "$EXPECTED_CERT" | grep -m 1 'SHA-256 digest' | awk '{print $NF}')"
          test "$SIGNED_SHA256" = "$EXPECTED_SHA256"
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$APK"
          python3 - <<'PYTHON'
          import json, os, shutil
          from pathlib import Path
          candidate = json.loads((Path(os.environ['GITHUB_WORKSPACE']) / 'app/build/outputs/apk/release/output-metadata.json').read_text())
          metadata = json.loads(Path('app/build/outputs/apk/release/output-metadata.json').read_text())
          output = metadata['elements'][0]
          assert metadata['applicationId'] == candidate['applicationId']
          assert output['versionName'] == '1.3.0'
          assert output['versionCode'] > candidate['elements'][0]['versionCode'], 'Rollback must install over the test without a downgrade'
          folder = Path(os.environ['RUNNER_TEMP'])
          shutil.copyfile(Path('app/build/outputs/apk/release') / output['outputFile'], folder / 'rmgu-rollback.apk')
          (folder / 'rollback-build-info.json').write_text(json.dumps({
              'sourceCommit': 'b75e542957dfc38d574bcc0df585578c8dd9c10d',
              'applicationId': metadata['applicationId'],
              'versionName': output['versionName'],
              'versionCode': output['versionCode'],
          }, indent=2) + '\n')
          PYTHON

      - name: Record test APK identity and checksum
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, shutil
          from pathlib import Path
          root = Path('app/build/outputs/apk/release')
          metadata = json.loads((root / 'output-metadata.json').read_text())
          output = metadata['elements'][0]
          apk = root / output['outputFile']
          folder = Path('test-apk')
          folder.mkdir()
          name = f"RootMyGalaxyUltra-{output['versionName']}.apk"
          shutil.copyfile(apk, folder / name)
          (folder / 'build-info.json').write_text(json.dumps({
              'sourceCommit': os.environ['GITHUB_SHA'],
              'applicationId': metadata['applicationId'],
              'versionName': output['versionName'],
              'versionCode': output['versionCode'],
          }, indent=2) + '\n')
          if os.environ['GITHUB_REF_NAME'].startswith('feat/susfs-priority-'):
              temporary = Path(os.environ['RUNNER_TEMP'])
              shutil.copyfile(temporary / 'rmgu-rollback.apk', folder / 'RootMyGalaxyUltra-1.3.0-rollback.apk')
              shutil.copyfile(temporary / 'rollback-build-info.json', folder / 'rollback-build-info.json')
              shutil.copyfile('app/src/main/jniLibs/arm64-v8a/librmgususfs_priority.so', folder / 'rmgu-priority-ctl')
              shutil.copyfile('docs/susfs-priority-filter-20261030.md', folder / 'README-priority-filter.md')
          (folder / 'SHA256SUMS').write_text(''.join(
              f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n'
              for path in sorted(folder.iterdir()) if path.is_file() and path.name != 'SHA256SUMS'
          ))
          PYTHON

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ startsWith(github.ref_name, 'feat/susfs-priority-') && 'susfs-priority-test-apk' || github.ref_name == 'test/bzja-20261030' && 'bzja-test-apk' || 'susfs-update-test-apk' }}
          path: test-apk/
          if-no-files-found: error
          retention-days: 14

